<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/background-stars.css" />
        <link rel="stylesheet" href="../css/submit/submit.css" />
        <script type="module" src="../js/i18n/changeLanguage.js"></script>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="../assets/icons/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Anthony David - Portfolio</title>

        <script type="module">
            import submitData from "../js/i18n/submit/submit.json" with { type: "json" };
            import { changeLanguage } from "../js/i18n/changeLanguage.js";
            const language = localStorage.getItem("language");
            const i18nData = {
                submit: {
                    elements: document.getElementById("submit").querySelectorAll("[data-i18n]"),
                    data: submitData,
                },
            };

            changeLanguage(i18nData, language);
        </script>
    </head>
    <body>
        <div id="background">
            <div id="stars"></div>
            <div id="stars2"></div>
            <div id="stars3"></div>
        </div>

        <main>
            <div id="content">
                <div class="content_section">
                    <div id="submit">
                        <div>
                            <h1>🎉</h1>
                            <h1 data-i18n="success.title">Message Submitted</h1>
                        </div>

                        <div>
                            <h2><mark data-i18n="success.thankYou">Thank You!</mark></h2>
                            <p data-i18n="success.body">Message has been received, I will be in touch soon.</p>
                        </div>

                        <button class="hover-up button" onclick="document.location = '../index.html'" data-i18n="success.button">Go Back</button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
